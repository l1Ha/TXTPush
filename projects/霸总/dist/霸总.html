<script>
const book = {"title": "霸总", "author": "TxtPush AI Writer", "description": "一个五十多岁的群演，一天要在微短剧里当几十回董事长；他把一夜暴富演给全世界看，回到出租屋，连下个月房租都没着落。", "total_words": 3830, "chapters": [{"index": 1, "title": "霸总", "words": 3830, "paragraphs": ["老陈的五十二岁，是花在片场的。", "北方这个影视基地，说是基地，其实就是一片铁皮棚子，加上几栋仿古的楼。每天天不亮，几百号群演蹲在大门口，等剧组的车来挑人。挑上了，一天一百二，管一顿盒饭。", "老陈不用蹲。他是“特约”——有台词的那种。", "他的招牌，是一头银发，和一张“像董事长”的脸。剧组的人，管他叫“陈董”。", "“陈董来了。”", "“陈董今天又演董事长？”", "他点点头，笑笑，把保温杯往腋下一夹，跟着人往里走。他走的步子，是从戏里学来的：不快不慢，下巴微微抬着，像这块地从他一出生就是他家的。", "十年前，他不是干这行的。那之前，他在南方一个厂里做事，厂子倒了，他出来，四处打零工。有一年，同乡拉他来基地当群演，混口饭吃。头一回上镜，导演一眼看中他：“这老头有那个脸，让他演老板。”", "从那以后，他就成了“陈董”。一演，十年。", "这十年，基地换了好几茬人。有人熬出头，去了横店，上了电视；有人熬不住，回了老家，进厂、跑外卖。老陈留了下来。他算不上好演员，可他稳：台词记得快，脸记得住，一天能拍几十场不喊累。导演们喜欢他。喜欢到，谁也想不起来他叫什么，只记得——“陈董”。", "一分钟一集的戏，叫微短剧。", "一集四十秒到一分钟，一部八十集到一百集。剧本薄得像一张传单，剧情写在便利贴上，一天能拍三四十场。", "天一亮，棚里就忙上了。灯光、机位、演员，像一条流水线。导演喊“预备”，喊“开始”，喊“咔”，一场就完了；换个灯，换个景，再来一场。演员背台词的时间，比拍的时间还短。", "棚里没有窗户，白天黑夜都靠灯。老陈出席过几十个“董事会”，坐过几十张不一样的长桌，可他心里清楚，那些桌子一收了灯，就都是同一张，搬来搬去。他签过的“合同”，也是同一份——正面是合同，背面还是合同。有一回，道具有人拿错了，让他签，他签完才发现，背面印着四个字：演员劳务。", "他笑了笑，又签了一遍。", "老陈演的角色，名字换来换去，人设只有一个：**董事长**、**霸总**、**家族掌门**。", "台词也差不多：", "“三分钟，我要这个人的全部资料。”", "“我不管他是谁，这块地，我要了。”", "“给我查，查到他祖上三代。”", "他说这些话的时候，要昂着头，眼睛从下往上瞟人。这个眼神，他练了很久。导演说他“有那味儿”。", "他自己知道，那味儿不是演的，是他这大半辈子，被人从上头看下来的味儿，倒过来用。", "他一天要死好几回，也要翻身好几回。", "微短剧的套路，就那么几样：主角先被人瞧不起——“赘婿”“保洁”“送外卖的”，受了天大的委屈；然后一个反转，主角其实是隐姓埋名的大人物；最后“打脸”，那些瞧不起他的人，跪一地。", "老陈多半演那个“被反转”的对象——一开始瞧不起主角、后来被吓得腿软的那个董事长。", "他一天要“腿软”十几回。", "有个刚来的小群演，叫小周，二十来岁，总跟在他屁股后头，问他怎么才能当“特约”。", "老陈说：你得有一张脸。", "小周问：什么脸。", "老陈说：让人一看，就信你有钱、或者有权，或者……活该被人踩。", "小周没听懂。老陈也没多解释。他领了两份盒饭，一人一份，蹲在棚子边上，扒拉着吃。今天的盒饭是土豆炖肉，肉少，土豆多。", "小周问：陈叔，咱这戏，有啥用啊。", "老陈说：有人看，就有用。", "小周说：他们说这戏是“电子榨菜”，下饭的。", "老陈说：那就更得有。人总得就着点啥，把饭咽下去。", "下午，真跪上了。戏里，那个“赘婿”当众亮出身份，满屋子的人齐刷刷站起来，又齐刷刷跪下去，跪老陈这个“董事长”。老陈跪在最前头，膝盖磕在水泥地上，闷闷的一声。他低着头，脸上的表情要“又惊又怕”。", "他做得很好。", "喊“咔”，他站起来，拍拍裤子，去墙根坐着，揉膝盖。小周凑过来问：陈叔，你咋跪得那么像。", "老陈说：跪多了，就都像了。", "有一回，他一个上午跪了二十次，收工的时候，膝盖肿得像个馒头。他跟场务要了张膏药，贴在裤子里，第二天接着跪。", "有人问他：跪这么多回，不难受吗。", "他说：戏里的跪，是假的。喊一声“咔”，跪着的人全站起来，笑着去领盒饭。", "真正让他难受的，是另一件事——他演了那么多回董事长，没有一回，是真的。", "有时候散场了，他一个人坐在那张长桌前。桌子是假的，椅子是假的，桌上那杯“洋酒”也是假的——是红茶。他端起那杯“酒”，对着空荡荡的棚子，慢慢抿一口。红茶是凉的。他放下杯子，把椅子推回原位，站起来。然后他想起，一会儿还要去领盒饭。", "钱是按天算的。", "有台词的特约，一天三四百；普通群演，一天一百二。老陈一个月的收入，好的时候一万出头，差的时候三四千。没有五险，没有合同。哪天剧组不要他了，就没有了。", "他在基地边上租了间屋子，一个月四百。屋里一张床，一个电磁炉，一个掉了漆的柜子。柜子上摆着他“最贵”的家当——一支道具雪茄，和一块不走的假金表。那是他从一个剧组“顺”回来的，导演说扔了算了，他捡了。", "墙上贴着一张纸，是他自己写的账：房租四百，水电一百出头，药钱几百，寄回老家一千。他每天算一遍，算完，把那张纸揭下来，再贴回去。有的月，账是负的。负多少，他不敢细看。他有一句话，常挂在嘴上，是说给自己听的：撑一撑，来年就好。这话，他说了好多年。", "夜里，他把表戴上，对着卫生间的镜子，念今天拍过的台词。", "镜子里那个银发男人，昂着头，眼睛从下往上瞟。台词语气拿捏得死死的，像随口一说，就能定人生死。", "他念完，把表摘下来，放回柜子上。表针停在三点零八分，一直没动。", "这是他一天里，唯一的舞台。", "他老婆在老家，身体不好，常年吃药。女儿在外地，做翻译。", "女儿不知道他在演戏。他一直跟家里说，他在“文化公司管点事”。他觉得，演董事长，好歹也算个“体面”的活。", "有一年回家过年，亲戚围着他问长问短。", "“在外面做啥？”", "“剧组里，管点事。”", "“演过啥？”", "他支支吾吾，夹了一筷子菜，把话岔开。他没敢说，他演的都是那种前脚威风、后脚被人一秒打脸的坏蛋。", "年夜饭上，电视里放着一部短剧。满桌人看得起劲，笑一阵，骂一阵。有人说：这戏真解气，穷人翻了身，把有钱人踩在脚底下。", "老陈低头扒饭。他认得那场戏——那部“穷人翻身”的戏里，跪在地上、满脸是汗的那个董事长，就是他。", "女儿给他夹了块鱼，说：爸，多吃点。", "他说：好。", "那天夜里，他没睡着。他躺在老屋的床上，听外头零星的鞭炮声。他想起自己刚来基地那会儿，还想着有一天能演个正经角色、一部正经戏。后来才知道，正经戏轮不到他。可他不后悔——一个月能挣几千块，老婆的药没断过，女儿的书念完了。他翻了个身，对自己说：值。", "后来他才知道，这些一分钟的东西，出了海。", "他的戏，被配上英文、西班牙语、葡萄牙语，一集一集，发到国外的手机上。听说，美国人看得最肯花钱，拉美、东南亚的人，最爱看“一夜暴富”。这些他不懂。他只知道，有个剧组的人半开玩笑地说：陈董，您在海外可有粉丝呢。", "有一天，女儿给他发来一段视频，说：爸，你看这个，火到国外了。", "视频里，一个银发男人，昂着头，冷冷地说了句不知道哪国的话——是配音。下面的字幕飞快地滚。评论区里，一堆看不懂的文字，一排排的点赞。", "女儿说：这个董事长，跟你长得有点像。", "老陈盯着屏幕，看了很久。", "屏幕里的那个人，是他。可那个人不欠房租，不用跪二十次，不用贴膏药。那个人，被人怕，被人恨，被人记着。", "他说：像。", "然后他把话题岔开了，问她：你那边冷不冷。", "挂了电话，他把那段视频又看了一遍。他把声音关掉，只看画面。那个银发男人，坐在长桌尽头，手指敲着桌面，一屋子人站着，等他发话。他看了很久，忽然抬手，对着屏幕里的那个人，比划了一下自己头上那撮白发。", "屏幕里的人，也一头的白。", "他笑了一下，把手机放下。", "真正难的，是那场哭戏。", "那天，导演临时改了戏，让老陈演一段“被扫地出门的老董事长”——儿子夺了权，他被人架出大门，一个人坐在空荡荡的大厅里，哭。", "老陈说：导演，我演不了哭。", "导演说：你演了几十年董事长，被人打了多少回脸，你怎么不会哭。", "老陈没说话。", "他想，戏里的“打脸”，都是假的——喊一声“咔”，跪着的人全站起来，笑着去领盒饭。真正疼的，是他这五十二年里，那些不打光、不喊“咔”的地方。", "他坐上那把道具太师椅。导演喊“开始”。镜头对着他。棚里的灯很亮，亮得他睁不开眼。", "他没有哭。", "他想起老家屋后那棵枣树，结的枣又小又甜；想起老婆药盒上的字，一天一次，一次两片；想起女儿问他“爸，你演过啥”。", "他的眼睛，红了。", "镜头还对着他，导演没喊停。他就那么坐着，眼睛红着，一动不动。棚里静了几秒钟。他听见自己的呼吸，很响。他想，要是时间能停在这儿就好了——停在他还是“董事长”的时候，停在他还没走出这扇门的时候，停在他还没回到那间出租屋的时候。可棚里的灯太亮，什么都停不下来。", "导演喊“过”。全场鼓掌。有人说：陈董这戏，是真哭啊。", "老陈站起来，抹了把脸，去领他的盒饭。", "那天收工很晚。", "他脱下租来的西装，交给服装师，摘下假金表，揣进兜里。他把银发往后捋了捋，走出片场。", "基地门口的路灯，一盏挨着一盏，亮到看不见头。他走着，影子被灯一照，拉得老长，又收得很短，又拉得老长。", "路过一家便利店，他停下，看了看橱窗里的一台电磁炉——跟他出租屋里那台，一个牌子，比他买的时候，贵了六十块。", "他没买。", "便利店的玻璃上，映出他自己。一个头发花白的老头，穿着旧夹克，手里攥着保温杯，站在一台电磁炉前。他看了自己一会儿，觉得这个人，跟白天那个坐在长桌尽头的男人，一点都不像。", "可他们，又的的确确，是同一个人。", "他摸了摸兜里那块假金表。表针，还是停在三点零八分。", "他想起白天那句台词：", "“三分钟，我要这个人的全部资料。”", "他笑了笑，往出租屋的方向走。", "他自己这一辈子，又有谁，肯给他三分钟。"]}]};

            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
</body>
</html>
