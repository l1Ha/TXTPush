<script>
const book = {"title": "淮上麦黄", "author": "TxtPush AI Writer", "description": "淮河滩区最后一季麦子熟了，七十二岁的留守老人周德山必须在土地流转协议上签字，他要签下的不只是地，还有埋在自家地头的老伴。", "total_words": 4585, "chapters": [{"index": 1, "title": "淮上麦黄", "words": 4585, "paragraphs": ["芒种前三天，周德山蹲在自家地头，看联合收割机从东边一路割过来。", "淮河离地头二里。水是黄的，滩地也是黄的。风从河上刮来，麦子一层一层倒下，沙沙地响，像谁把一沓钱摊开在数。德山蹲久了，腿麻，扶膝站起来，右手在地上撑了一把，那手不听使唤，细细地抖。他把手攥成拳，背到身后。", "驻村的小徐在地头站了半个钟头，不催，也看麦子。", "“周叔，喝口水。”她把一瓶水放在他脚边。", "“不渴。”德山说。", "裤兜里的老年机震了一下。第四个电话了。他没掏。", "这是淮滨县谷堆乡周湾村。周湾在淮河滩上，一百来口人，常住的不到三十个，一多半过了六十。村小的铁门锁了两年，娃娃都去乡里、县里上学。地是淤出来的，肥，也怕水。老辈人讲，周湾的地是淮河吐出来的，早晚还得叫淮河吃回去。德山种了五十年，前半辈子怕水，后半辈子还怕，怕着怕着，就把人怕老了。", "小徐是县里派下来的，去年到的，二十七八岁，说话慢。今天她为签协议来。县上要把这片滩地统一流转给合作社，搞高标准农田；行洪区的人家，往后要迁到乡里的新社区。红纸贴在村部门口快一个月了，德山没去看。", "“周叔，您那几亩，一年租金算下来……”小徐翻开本子。", "“我不签。”", "他起身往地里走。麦子齐腰深，他走进去，只剩个花白的脑袋在麦浪上浮。小徐在后头喊了声叔，他没回头。", "麦是弱筋麦。淮滨的弱筋麦出名，做饼干做糕点，粮库按合同收，比普通麦贵两分。德山种了一辈子，最得意自家麦子筋道，磨出的面蒸出的馍白。签协议要按手印，红泥糊在指头上，他嫌脏。", "真正的原因他没说。", "地头往西二百步，有一片巴掌大的杨树林，是他家的。林子里埋着他女人，李秀云。三年了。年年麦收，他都在坟前搁一把新麦。那把麦子，从没断过。", "地一流转，坟就保不住。红纸上写得明白：迁坟。这四个字他认得。他在红纸前站过一回，站了一袋烟的工夫，谁也没告诉。", "儿子周小军是傍晚回来的。", "从郑州回来，一夜火车，两趟汽车，到家天擦黑。小军四十出头，在郑州送快递，晒得跟滩上的土一个色。进门先找水，一口灌下半瓢。", "“爸，电话咋不接。”", "“下地了。”", "“下地。”小军把瓢往桌上一搁，“爸，说正事。县里那个协议，签了没。”", "德山蹲在门槛上剥蒜，不吭声。", "“航航明年上高中，县里要择校费。我跟你媳妇合计了，县城的房子也看了，首付差十万。爸，你那补偿，加上地租，凑一凑……”", "“地不卖。”", "“谁让你卖？流转，流转！地还是你的，别人替你种。”", "“坟咋办。”", "小军噎了一下。", "“坟……坟能咋办，迁呗。迁乡里公墓，政府还补贴。爸，啥年月了，谁还守滩上的坟。发一场水，啥都冲没了。”", "德山剥了一地蒜皮，白花花一片。他不看儿子。", "“你妈睡那儿。”", "小军的火窜上来，又压下去。他在城里受了气，回家还是不敢跟爹顶。他蹲到德山对面，声音软了。", "“爸，我不是不孝。城里啥都好，你跟我去，看病、养老，航航也在跟前。你守这几亩，一年挣几个？你手都抖了，你自己看。”", "德山把手背到身后。", "“我手抖，我知道。不用你管。”", "“我不管你谁管你。”", "那一夜父子俩没再说话。德山睡西屋，半夜起来，走到院里看星。麦黄的天，星是清的。他想起秀云在的时候，两人在院里乘凉。秀云说，德山，等咱俩老了，就埋在那片林子里，看着麦子。德山说，中。", "小军在家待了三天，帮着清了地头的渠，又走了。临走把一张银行卡塞进炕席底下，说密码是航航生日。德山没动它。", "这天日头毒，邻居王老五骑着电动三轮过来，车斗里搁着两袋化肥。他在田埂上刹住车。", "“德山，签了没？”", "德山摇头。王老五去年就签了，地租一年一结，人清闲。他蹲下来，摸出烟，递一根，德山没接，他自己点上。", "“我跟你说，签了省心。我那几亩流转出去，一年一千二，旱涝保收。我在家带孙子、赶集、打牌，比种地强。”", "“你那猫爪草还种不？”德山问。", "王老五去年种了一亩猫爪草，药材，赶上好行情，挣了两万。村里人眼红，今年呼啦啦跟种，行情就塌了。", "“种个屁。”王老五吐了口烟，“今年烂在地里，收药材的给八块钱一斤，草都不如。你说这地，你伺候它，它不领你情。”", "德山不说话，看远处。麦浪一层压一层，像有话要说。", "“我不是舍不得地。”德山忽然说。", "“那你是舍不得啥。”", "德山没答。他望着西边那片杨树林。", "王老五顺着看过去，叹了口气，不问了。", "秀云是三月里倒下的。", "先前只当是胃不好，吃点药就过去。后来越吃越瘦。小军把她接到郑州，住了一个月的院，钱一天一天往外淌。回来那天，人是清醒的，秀云拉着德山的手，气短，一个字一个字往外挪。", "“德山，别费钱了，回去。”", "“中。”德山说。", "回来第三天，人就没了。", "办后事那阵，小军说，爸，火化吧，乡里有规定，也省钱。德山蹲在院里，一句话不说。小军又说了一遍。德山蹲了半晌，站起来，拍了拍膝盖上的土。", "“你妈怕冷。”", "那年麦还没黄。德山请人把秀云葬在西边那片杨树林里，坟头朝着自家的地。他想，等麦黄了，秀云一睁眼，就看得见麦子。", "秀云临走前，还惦记着一件事。她说，等收了麦，给你做双新布鞋。你那双鞋，后跟都磨透了。", "鞋没做成。可德山记着，记了三年。", "夜里，手机响了。是视频。德山手忙脚乱按了半天，才接上。屏幕里冒出孙子的脸，航航，十三了，戴眼镜，在县里寄宿。", "“爷。”", "“哎。”", "“爷，我爸问你签字了没？”", "德山把手机举远些，好让孙子看清他。", "“没呢。”", "“爷，你来县城住呗。我们班王小胖他爷就来了，天天接送他，还给他做饭。”", "德山笑了一下，脸上的褶子挤到一处。", "“爷去了，谁看麦子。”", "“麦子有啥好看的。”航航说，“爷，我想吃你蒸的馍。”", "德山鼻子一酸。他说：“麦收了爷就蒸。新麦，蒸出来的馍白、喧。”", "“那你啥时候收麦。”", "“快了。芒种就收。”", "视频那头，儿媳在喊航航写作业。航航匆匆说了句爷再见，屏幕黑了。德山举着手机，在黑暗里又坐了一会儿。", "第二天傍晚，德山沿着村道走。", "十几户的门锁着，门前长了草，草从砖缝里往路上爬。墙上刷着“土地流转富民强村”的红字，掉了角。太阳能路灯亮了，照着一排排空房子，窗户是黑的。", "村口大槐树下坐着几个老人，说闲话。说谁家的儿子在城里买了房，说谁家的媳妇三年没回来过年，说东头的老李前些天走了，停灵三天，儿女才从外地赶回来。", "大喇叭响起来，先播防汛，说汛期到了，住得低的要留神；又播防溺水，说不许小孩下河；末了念了一遍搬迁安置的名单。念到“周德山”，德山站着听。风把字吹散了，他没听清后头还念了谁。", "风从滩上过来，带着麦子的气。他往家走，脚步慢，像是踩在自己的影子上。", "隔天，德山坐早班车进了县城。", "先在县医院拍片。大夫看了片子，说，帕金森，早期，得长期吃药。进口的贵，国产的便宜些，新农合能报一部分。德山问，一片多少钱。大夫说了个数，他在心里算了算，没算明白。", "出了医院，日头正高。他沿着街走，走到航航的学校门口。隔着铁栅栏，一群半大孩子在做操，胳膊举得一样高。他认了半天，没认出航航。", "再往前走，是售楼处。玻璃门上贴着红纸，一平米多少多少。小军说的那套房子，就在这楼上。德山站在门口看了一会儿。玻璃里映出他自己，一个黑瘦的老头，背有点驼，手插在兜里。", "他没进去。", "回村的车是下午的。他在车站蹲着，吃了一碗面，六块钱。面没有自家的筋道。", "第五天，小徐又来了，带着农技站的人量地。", "“周叔，量地不耽误您收麦。”", "德山在地里薅草。小徐蹲下来，也薅。她是个实在人，薅得比德山还干净。薅了一阵，她说：", "“周叔，我跟您说实话。这地，明年开春就平整，上大机械。您这块地，绕不开。”", "德山的手停了。", "“绕不开。”小徐轻声说，“不是我们非要……是保不住了。汛期一来，滩里存不住东西。您那坟，早晚也得迁。不如趁这回，一块儿安置妥当。”", "德山蹲在麦垄里，半天没动。", "“我知道了。”他说。", "送走小徐，德山去了工具棚，翻出那把镰刀。锈了。他蹲在磨石旁磨，磨了一个钟头，磨得能照见人影。", "天黑透，他打着手电，往西二百步，进林子。", "秀云的坟不高，土是旧的。坟前搁着他去年那把麦穗，早干了，风一吹，簌簌响。", "德山把镰刀搁在坟头，蹲下来。他这辈子话少，跟秀云也话少。他蹲了很久，才开口。", "“秀云，地要收了。”", "“不是我要卖。是淮河要，是公家要。我拦不住。就像那年你走，我也拦不住。”", "“我原想着，就这么守着，守到我也躺下。可我不中用了，手抖，眼也花。航航要上学，小军在外头不容易。”", "“我想了想，不能叫人家来刨你。要迁，我自个儿给你迁。挑个高地方，能望见淮河。你爱看水。”", "他说完，抹了把脸。手电的光在坟头晃。", "他对着坟磕了三个头，慢慢的。", "第二天一早，他去村部找小徐。", "“协议，我按手印。”他说，“我有两句。头一件，这季麦，我自己收完，收完再动地。第二件，迁坟按我的规矩来，日子我定。”", "小徐点头，一笔一笔记在本上，又抬头看他。", "“周叔，您想通了？”", "“没想通。”德山说，“是想开了。”", "他按了手印。红泥糊在指纹里。他看着那团红，像麦熟了。", "消息传到槐树下，比风还快。", "“德山签了。”", "“签了？他可是咱村最犟的一个。”", "“签了好，进城享福。”", "王老五蹲在最边上，抽着烟，磕了磕烟灰。", "“你们懂个屁。”他说。", "德山从旁边过。谁也没看他，他也谁都不看。", "签完字，德山没回家。他借了王老五的电动三轮，去了乡里。", "新社区盖在乡政府后头，六层，一排排，外墙刷得雪白，还没住满。搬来的人家，窗户上贴着红纸。", "德山锁了车，进了一栋。电梯他不会按，就爬楼梯。爬到五楼，走廊长，两边都是门，一模一样的门。他数着走，走到最里头那间——小徐说的，五楼，朝阳，是他的。", "门锁着。他从门上的小玻璃往里看。屋里空着，白墙，白地，一股石灰味。他站到走廊尽头的窗边，往南看。楼挡住了，看不见淮河，也看不见他的地，只看见一片新楼，和楼缝里的一线天。", "他在楼道里站了一会儿，下楼，骑车回村。风从滩上刮来，还是麦子的味。", "收麦那天，天好。", "合作社的收割机开进德山的麦地，轰隆隆，一片黄涛倒下去，麦粒从卸粮筒里淌出来，金灿灿，堆成个小山。德山站在地头，手里攥着条蛇皮袋，接头一捧新麦。麦子热，烫手，还带着地里的气。", "收割机绕开那片树林。坟前还剩一小片麦，机器进不去。", "德山拎着镰刀走过去。他弯下腰，右手抖，镰刀在麦秆上滑了一下，没割断。他停下来，喘口气，用左手扶住右手，一点一点，把那小片麦割下来。割得歪歪扭扭，像娃娃写的字。", "汗从他花白的鬓角往下淌，砸在麦茬上。", "割完，他把那把麦子扎成一小束，整整齐齐，搁在坟头。", "“秀云，新麦。”他说，“今年筋道。”", "麦子摊在村道上晒。日头毒，麦粒在太阳底下翻着身。粮贩子开着三轮来收，一斤给一块一毛五。德山卖了大半，留了一袋。他把留下的那袋扛去磨坊，磨成面。", "夜里，他蒸了一锅新麦馍。馍喧，白，揭锅的时候，热气扑了满屋。他先拣了个最圆整的，用干净的布包了。", "迁坟那天，德山没吹唢呐。他请了两个本家弟兄，一副薄棺，把秀云挪到了乡里的公墓。新坟选在最上一排，往南看，能看见淮河大堤，白白的一道。", "德山在坟前栽了棵小柏树。他把那包新麦馍打开，搁了一个在碑前。", "“秀云，馍蒸好了。”他说，“鞋你没能做成，馍我替你蒸了。”", "回来那天，小军的车停在村口等他。屋里东西不多，一个蛇皮袋就装完了。德山把那把镰刀在门槛上磕了磕，想带上，又放下。他把它插在门后的墙缝里，插得端正。", "锁门的时候，他回头看了一眼。麦茬地一望到头，金黄的，空荡荡的。风过处，还是沙沙地响。", "他上了车。小军发动车子，往县城走。车过淮河大堤，水在底下淌。", "德山从兜里摸出一穗麦子，是坟前那把里剩的。他攥在手里，没说话。", "麦芒扎得手心痒。他没松。"]}]};
const L = {"cover_label": "扉页与作品简介", "unit": "字", "by": "作者：", "meta_sep": " | 全书约 ", "intro_title": "作品概念与梗概", "prev": "← 上一章", "next": "下一章 →", "start": "开始阅读第一章 →", "ch_prefix": "第 ", "ch_mid": " 章 | ", "theme_dark": "☀️ 亮色模式", "theme_light": "🌓 暗色模式"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
