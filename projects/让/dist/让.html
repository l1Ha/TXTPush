const book = {"title": "让", "author": "TxtPush AI Writer", "description": "一个县城男人过了六十年，总说自己命不好、不够努力。后来他一件一件想起来：电大的名额、分房的号头、南下的车票、新街的门面、儿子的志愿——每一次，都是他自己让出去的。让的时候，都有一个体面的理由。", "total_words": 5986, "chapters": [{"index": 1, "title": "让", "words": 5986, "paragraphs": ["周六下午，马有良提前下楼，拿两个马扎占了两个车位。", "老小区车位紧。儿子开车回来，倒车的时候他在后头打手势，手一摆一摆，像当年在车间比划零件。", "马骁上个月刚换的车，十来万，白色的。孙女四个月，抱在顾晓怀里，手指头攥得紧，见谁都攥。", "马骁的手机响个不停，他看一眼就按掉。进门前，他在阳台上接了一个，声音放得低，说的是普通话，跟他平常说话不是一个腔调。", "屋里杨素梅在灶上忙。六菜一汤，两个是给儿媳炖的。她嘴里念叨：现在的月嫂贵，亲家母又腰不好。念叨归念叨，汤炖得浓。阳台上晾着两床小褥子，是她给孙女做的，昨天刚洗，天到下午阴了，她念叨着可别下雨。", "饭吃到一半，马骁把筷子放下。", "爸，妈，跟你们说个事。公司要在沿海设点，竞聘一个主管，去驻场，一年起。", "顾晓没接话，低头给孩子掖包被。", "马骁说：竞上了，工资涨一截。回来，位置就是你的。", "杨素梅削着苹果，皮一圈一圈不断。她说：你自己想。", "马骁看着他。", "爸，你说，争不争？", "马有良夹了一筷子菜，慢慢嚼。嚼得很久，最后咽下去。有一个字在他嗓子眼停了一下——争。这个字他没说出口，换成了他这辈子最熟练的一句话：你拿主意。", "马骁那一眼，在他脸上停了两秒，像想等下一句话。没有下一句。儿子把眼睛收回去，端起杯子喝水。", "他拿过酒瓶给儿子倒酒。马骁说：开车，不喝。他给自己倒了半杯。那半杯，喝到饭凉。", "吃到后头，说起下周二老宅片区改造签字的事。户口本、房产证、退休证，都得带齐。马骁说：我请假，陪你去。", "好。他说。", "吃完饭，马骁看见阳台的晾衣架一头松了，找了把钳子，蹲在那儿拧。他站在旁边看，想说「我来」，没说。", "夜里十一点，老两口还没睡。他坐在床边，膝盖上放着个牛皮纸档案袋。", "那是他的家底。户口本，结婚证，下岗证，买断协议，退休证，都在里头。他把它们一样一样抽出来，翻上去，再翻下来，找该带的几样。", "翻到一半，摸出来一张硬纸片。", "1985 年，准考证。照片上的人十九岁，头发是黑的，脸绷着。", "他对着灯看了看，放回去。又抽出来。又放回去。", "杨素梅在被窝里翻了个身：找着没有？", "找着了。他说。", "他把灯关了。黑暗里，那张纸还压在他手底下。", "1985 年，厂里给了一个电大名额，带薪念书，念完提干有指望。", "整个车间，就他和张德发报了名。", "张德发家难。老娘常年吃药，媳妇没工作，仨孩子，一个赛一个瘦。报上名那天，张德发在食堂跟人嘀咕：这回得拼一把了。", "他跟杨素梅那时刚处上。素梅在纱厂，一天站八个小时。她跟他说：你去考呗，考上了请你吃烧鸡。", "复习资料是工会发的，蓝皮册子，一本语文，一本数学。", "语文他不怕。数学，翻到函数那一章，他看了三遍。第一遍没看懂，第二遍没看懂，第三遍，他把书合上了。", "合上之前，他把那几页折了个角。他还抄过一页公式，抄在烟盒纸的背面，字小，挤。", "考前一夜，他给家里修水龙头。水龙头没坏，就是滴答。他拆开，换了个皮垫，擦干，装回去。蹲在灶下鼓捣了两个钟头。他娘说：早点睡，明儿还有正事。", "他说：中。", "第二天早上，他跟车间主任说：名额让给老张吧。老张家里比我困难，人家比我有用。", "主任拍他肩膀：小马，风格高。", "开大会，书记在台上说：这次名额的事，小马同志风格高，值得全厂学习。他坐在底下，手心出了汗。", "老张去考的试。老张念的大学。老张后来提了干，一路当到质检科长。后来老张管质检，查他的活，查得最细，也最挑不出毛病。", "他一直在车工班。车床一开，铁屑一卷一卷往下落，落到袖口里，发烫。", "成绩下来那天，老张拎着两斤桃酥上他家，坐在床沿上，说了一个多钟头感谢的话。桃酥他娘舍不得吃，放到发了软。", "车间里后来有人说闲话，说他傻。他听见了，没回头，接着摇他的刀架。", "很多年后，老张退休办酒。酒过三巡，老张把他拉到一边，拍他肩膀：有良，那年的名额——", "他端起杯子：喝酒。", "老张看了他一眼，没再往下说。", "这些年，老张待他客气得过头。逢年过节，老张家的饭店订了包厢，总要请他一家；他搬家，老张带着人来搭手，什么重活都不让他碰。客气到这个份上，反倒生分。", "准考证是他自己留的。当时报完名，照片贴上，章一盖，发到手里。考试没去，这张纸却没丢。有一年家里搬家，素梅问这破纸还留着干啥，他说：当个纪念。", "他记性不好，家里的事丢三落四。可这些没用的纸，他一张没扔。", "1992 年，厂里分房。", "打分，公示，红纸黑字，贴在食堂门口。工龄分，人口分，双职工再添两分。他家三口人，素梅也是职工，排第九。", "第九名，分的是 302，朝南。两间半，前头没遮挡，冬天太阳一直照到床沿。", "素梅盘算了半个月：南墙下放五斗柜，窗底下摆缝纫机，孩子的小床靠里搁。她还托人换了班，跑去看过两回房。", "他抄了张纸条：马有良，302。", "抄完，他没去看第二遍。他去了分房小组，找刘主任。", "刘主任说：你第九，稳。", "他说：周金海一家五口，老娘瘫在屋里，两个孩子睡上下铺。先紧他吧。我不争。", "刘主任看了他半天：小马，你想好。", "他说：想好了。", "榜重新贴出来那天，素梅下了夜班，站在榜底下，一个名字一个名字看。看到自己家的名字，挪到了后面。302 是周金海家的。", "她回家，一句话没说，坐下来剥花生。", "那两天剥的花生，后来炒出来，装了满满两罐头瓶。她一粒没吃。", "她剥花生的第二天，他娘从乡下来。老人家先去 302 那栋楼下站了一会儿，再上的六楼。进屋什么也没说，把带来的两罐腌菜放上了灶台。", "他们分到 601。顶楼，六楼，西晒。夏天下午，西山墙晒得烫手，晚上十点摸上去还温。电扇吹出来的是热风。素梅怀着马骁那阵，热得半夜坐起来，他就拿湿毛巾给她擦背，一遍一遍。", "那些年的夏天，他午休起来先上房顶，一桶一桶往上拎水，泼一遍，屋里能凉半度。房顶漏水，修了三回没修好，第四回他自己爬上去糊油毡，手上烫掉一块皮。", "秋天，有一回下雨，楼顶漏了一角，水滴到搪瓷盆里，一夜一滴答。", "楼下的人见了他都说：马有良是好人。", "周金海搬进 302 那天，拎着两瓶酒上六楼，说：有良，这个情我记着。", "他说：住得舒坦就行。", "两家后来处成了好邻居。包饺子来回送，孩子放学互相看。只是每年一到三伏天，素梅的脾气就急一点，谁也别提房子的事。", "酒他没喝，收在柜子里。去年过年，周家照例端来一碗红烧肉，两只碗换来换去，还是那两只。", "那张抄号的纸条，他没扔。夹进了档案袋。", "为什么留，他也说不上来。就是没扔。", "1996 年，钱贵生回来了。", "钱贵生是车间的兄弟，比他能说，敢干。1989 年辞了职，先去深圳，后到东莞，在五金行里给人打工。", "那天他骑一台崭新的摩托车到厂门口，墨镜一摘：有良，跟我干去。咱俩合伙，开个门市，我出货源，你管账。", "他心动了。心动得睡不着。", "他跟两家亲戚凑了五千块钱。素梅把家里的两千存款也拿出来了，用块手绢包着。他说：就干一把。", "长途票买了。去东莞的，八十六块。", "临走前一夜，他又把钱一家一家还了回去。", "二舅家灯都关了，敲开门，把一千塞回去。二舅问：咋不去了？他说：家里走不开。", "素梅那晚坐在小板凳上，看着他数钱，看着他卷起手绢，看着那两千块又放回抽屉。", "那一夜他没怎么睡。天蒙蒙亮，他起来把院子扫了一遍，扫得比哪天都干净。", "第二天，他去车站把票退了。广播里正在报他那趟车。他站在广场上听，报完了，才进的退票厅。退票单巴掌大，白色的，上头的字是铅印的。", "对外他说：素梅胃不好，娃又小，走不开。", "后来钱贵生一个人走的。走前在他家喝了一顿酒。酒是散装的，下酒菜是素梅炒的鸡蛋。喝到后头，钱贵生撂下一句：你舍不得这个铁饭碗。", "他笑了笑，给他满上。", "两年后，厂子不行了。第三年，下岗。铁饭碗是搪瓷的，磕一下掉一块瓷。", "钱贵生在东莞扎住了，先批发五金，后自己做牌子。回来过年，开的是桑塔纳。", "头几年阿贵每年来一封信，信里夹照片：门市的照片，新车的照片，后来是三层小楼的照片。信他看完就压在玻璃台板底下。压了两年，素梅收拾桌子，把它们收进了抽屉，谁也没再翻。", "又过了八年，2004 年。县城开新街，门面房卖。售楼处设在一个铁皮房里，传单是铜版纸的，印着四个金字：黄金旺铺。", "素梅想买。她说：咱这些年攒了四万，借点，付八万的首付。买一间，租出去，也比放着强。", "他拿传单看了好几夜。", "小舅子那时候要开电动车行，缺一间铺面，上门来借钱，没张口先叹气。他把传单往报纸底下一塞，说：让他先买吧，人家开店，急。", "小舅子买了 12 号。", "素梅等了一年，两年。街起来了，先通车，后通公交，再后头，租金一年一年往上走。去年有人来找小舅子，出价二百三十万。没卖。", "2004 年冬天，为了这事，素梅跟他吵了第一架。", "结婚十几年，头一回。她说到一半声音就抖了：你让名额，让房子，让车票，什么你都让。轮到自己家，你也让。", "他站在门口，没还嘴。", "杨素梅说了那句他记了半辈子的话：", "你不是让，你是怕。", "他把门带上，到楼下蹲着，抽了半包烟。", "那一晚他回屋的时候，掸了掸身上的烟味。素梅已经睡了，背对着他。桌上的饭盖着碗，是热的。", "后来阿贵回来请客，他一个人去的。去了半宿，回来的时候巷子里的狗都叫累了。素梅没睡，给他留了灯，桌上摆着一碟咸菜。", "小舅子后来逢年过节来得勤，礼也重。有一年喝多了，拉着他的手说：哥，那年要不是你——他说：喝茶。", "退票单和售楼传单，都在档案袋里。传单上那间 12 号，被人用圆珠笔圈了起来。是他自己圈的。", "2008 年，他四十二，报了驾校。", "学费两千八，交的现金。收据是三联手写的，红章盖在角上。", "他不是一时兴起。他去看过两回，问了学费，问了时间。报名那天，他把身份证递进去，手指头在柜台上点了两下。", "第一天练倒库。教练坐副驾，拿根小棍敲他手背：打死！回！你这手是借来的？", "旁边的年轻人笑。都是二十出头的小伙子，脚上一色球鞋。他穿的是布鞋，鞋边上有一点洗不掉的机油印。", "他倒进去一次，压线。又倒一次，出库的时候快了点。", "第二天，他没去。", "第三天，他去把学退了。扣了两百，退回两千六。", "素梅问他：退了？他说：退了。她哦了一声，没再多问，把收据接过去，放进了抽屉。", "退完钱，他没走。站在场地边上看别人练倒库，看了一个钟头。回来的时候，公交车坐过了一站。", "有人问他咋不学了。他说：学它干啥，又没车。", "这话对一半。", "更底下那半截，是他五岁那年的事。", "那时候大队有一台小四轮。开车的姓郝，复员的，军装上衣洗得发白。拖拉机从村口过，嗒嗒嗒，黑烟一股一股。他跟着跑，跑了一里地，一直跑到腿软。姓郝的回头看见他，笑了，让他摸了摸方向盘。铁的，凉的，比家里的锅盖都亮。", "那天有人逗他：长大了想干啥？", "他说：开拖拉机。", "满屋人笑。那是他这辈子头一次说「想要」，也是往后五十多年里，唯一一次。从那天起，「想要」这两个字，他学会了不往外说。", "2013 年，马骁高考。", "考试那几天，他去考场外头站了两场。别的家长凑在一堆说话，他不说，站在树底下，站到散场。", "分数出来，比平时高，够冲一冲。班主任王老师把电话打到家里：老马，省外那所工科学校值得冲，专业硬，牌子老，就是名气冷。别的我不敢说，这孩子填了不亏。", "他捏着电话，嗯了好几声。", "挂上电话，他坐在沙发上，把那张分数条看了半天。稳，还是冲。稳就是省城二本，离家近，花费也在掌控里。冲就是大西北，三千里外。", "志愿表是马骁自己带回来的。晚上，儿子把表摆在他面前，笔也递过来：", "爸，你定。", "他在表上停了很久。最后，他把笔尖落在稳妥的那一档。", "素梅为这个跟他吵了第二架：你别把你那一套，传给孩子。", "他说：我这是为他好。", "那晚马骁没说话。他装睡。素梅在儿子屋里说话，声音压得低，他听见半句：你爸那是——后头的没听清。他翻了个身，把耳朵压进枕头里。", "第二天早上，他看见儿子把志愿表装进书包里，拉链拉得整整齐齐。", "马骁后来在省城上的大学，毕业留下来，做了技术员。", "有一年过年，马骁说起同学聚会，顺口说了一句：我要是去了那边，也行吧。", "说完就岔开，说别的去了。", "这句话，马有良记到今天。", "马骁去省城报到那天，是他送的。长途车上，儿子靠着他睡着了。他看了一路窗外。那趟车，比他 1996 年退掉的那趟，短得多了。", "驾校的收据，儿子的录取通知书复印件，都在档案袋里。收据上的字，浅了，还能看清：2800，扣 200。", "周日晚上，马骁一家走了。", "车开到楼下，他给孙女把包被压了压。顾晓说：爸，下周签字我们早点来。", "他说：中。", "夜里九点多，手机响了一下。马骁发来的：", "爸，名我报了。晓晓支持我。", "马有良坐在沙发上，打了两个字：好。看了看，删了。", "又打：好好干。看了看，也删了。", "最后回过去两个字：", "好好。", "发完，他把手机扣在茶几上。杨素梅从厨房出来，问：谁啊？", "儿子。他说，名报了。", "素梅点了点头。她把抹布搭在椅背上，说：那天夜里，我也给他发了。", "发了啥？", "我说，你自己想清楚，妈都支持你。", "他看着她。半晌，他说：我这辈子——", "后半句没出来。素梅也没问。她只是把电视的声音调小了一格，说：早点睡。", "后来他才知道，那一夜，素梅还没睡，在阳台上站了一会儿。楼下那条老街的路灯，坏了一盏，暗了一段，再亮。", "马骁在电话里还说了一句：爸，你跟妈说，晓晓那边，她娘家也支持。", "他说：中。", "挂了电话，他想起一件事：他好像从来没问过素梅，你想要啥。", "周一早上，素梅醒得比他还早，煮了两个鸡蛋，让他带上。他揣着热鸡蛋出门，一个没舍得吃，回来的时候，还在兜里。", "报名大厅里，人多，都是小年轻。他在长椅上等号，从九点等到十点半。", "排队的时候，前头一个女的跟他搭话，说五十了，学车给女儿当代驾。他嗯了一声，没多话。", "窗口里问：学还是？", "他说：。", "难一点。里头看了看他：您这岁数， 好学。", "能开手动的。他说。", "表填完，交上去。里头说：回去等通知，明天下午来上课。", "他把笔帽按回笔上，放在窗台上，出门。", "对街就是老淮光厂。拆了，围挡圈着，里头的草长到半人高，大门口的两个水泥墩子还在。他走过去，隔着围挡站了一会儿。", "隔着围挡，好像还能听见车床的声音，一转一转。他在淮光干了十五年，车过多少根轴，他没数过。他记得的是他那台车床的编号，3056，漆掉的边角，摇刀架的时候手搭哪。", "门口传达室的墙上，原来挂着一块白底黑字的厂牌。现在那儿是空的。", "他想起五岁那年追过的拖拉机，想起姓郝的让他摸的方向盘——铁的，凉的。", "也想起素梅在楼上剥花生那个晚上，一粒没吃。", "六十岁的人报名学车，窗口那个姑娘送材料出来，路过他，笑着问了一句：叔，你咋想起学这个啊？", "他说：想学。", "窗口的姑娘笑了笑：行，叔，明儿见。", "出了驾校的门，日头很好。风从淮河那边吹过来，带着点水腥气。", "路过水果摊，他站住，称了两斤橘子。素梅爱吃橘子。这件事他记着，买过的回数，一只手数得过来。", "摊主说：叔，这橘子偏酸。他说：她爱吃酸的。", "他上楼的时候，楼道灯坏了一级，他一脚踩空半格，扶住墙站住了。六楼，他爬了三十年，闭着眼都数得清台阶。", "素梅正在擦灶台。", "报上了。明天下午上课。", "素梅直起腰：回来得正好。", "咋正好？", "水龙头坏了三天了，你修修。", "他往厨房那头看了看。这一回，水龙头是真的坏了。", "周末还得去老宅签字，户口本、房产证，都在档案袋里。他把档案袋的拉链拉了拉，放回柜子最里头。想了想，又抽出来那张 1985 年的准考证，看了一眼，放回去。", "然后，他进了厨房。"]}]};
const L = {"cover_label": "扉页与作品简介", "unit": "字", "by": "作者：", "meta_sep": " | 全书约 ", "intro_title": "作品概念与梗概", "prev": "← 上一章", "next": "下一章 →", "start": "开始阅读第一章 →", "ch_prefix": "第 ", "ch_mid": " 章 | ", "theme_dark": "☀️ 亮色模式", "theme_light": "🌓 暗色模式"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
